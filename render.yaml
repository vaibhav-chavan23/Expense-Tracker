services:
  - type: web
    name: expense-tracker-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_CONN
        sync: false          # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set manually in Render dashboard (your Vercel URL)
      - key: PORT
        value: 10000         # Render uses port 10000
